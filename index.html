
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crush mo ba ako? 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container" id="main">

        <!-- QUESTION SECTION -->
        <div id="question">

            <img
                class="gif"
                src="https://media.tenor.com/8K7uZr5q0LwAAAAi/bubu-dudu-love.gif"
                alt="Cute love bears"
            >

            <h1>Crush mo ba ako boi? 💗</h1>

            <p>Be honest ha... wag kang mahiya! 🥺</p>

            <div class="buttons">

                <button id="yesBtn">
                    YES 💖
                </button>

                <button id="noBtn">
                    NO 😭
                </button>

            </div>

            <div class="footer">
                Made with 💗 just for you
            </div>

        </div>


        <!-- SUCCESS SECTION -->
        <div id="success">

            <h1>YEHEYYYY!!! 💗🥹</h1>

            <p>
                Alam ko naman eh! HAHAHAHA! 😭💕
                <br><br>
                So ibig sabihin may chance na ako?
                <br>
                Happy Valentine's Day, boi! 🌹
            </p>

            <!-- FLOWER ANIMATION -->
            <div class="flower-scene">

                <div class="flower">

                    <div class="petals">

                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>

                    </div>

                    <div class="center"></div>

                    <div class="stem"></div>

                    <div class="leaf leaf-left"></div>
                    <div class="leaf leaf-right"></div>

                </div>

            </div>

            <h2 class="flower-message">
                A flower for you! 🌷
            </h2>

            <div class="success-hearts">
                💗 💕 💖
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
